// SM-2 algorithm: interval in days, easiness factor, repetitions
function getAnkiCards(st) {
  const now = Date.now();
  return VOCAB.map((v, i) => {
    const card = st.ankiCards?.[v.nl] || { interval:0, ef:2.5, reps:0, due:0 };
    return { ...v, ...card, due: card.due || 0, isDue: (card.due || 0) <= now };
  });
}
function updateAnkiCard(card, grade) {
  // grade: 0=again, 3=good, 5=easy
  let { ef=2.5, interval=0, reps=0 } = card;
  if (grade < 3) { reps=0; interval=1; }
  else {
    if (reps===0) interval=1;
    else if (reps===1) interval=6;
    else interval=Math.round(interval * ef);
    reps++;
    ef = Math.max(1.3, ef + (0.1 - (5-grade)*(0.08+(5-grade)*0.02)));
  }
  return { interval, ef, reps, due: Date.now() + interval*86400000 };
}

function speak(text){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang="nl-BE";u.rate=0.82;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

async function callClaude(messages,system="",maxTokens=500){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,
      system:system||"Sei un tutor esperto di fiammingo sanitario per operatori italiani che lavorano in Belgio. Rispondi in italiano con esempi in fiammingo. Sii conciso e pratico.",
      messages}),
  });
  const data=await res.json();
  return data.content?.[0]?.text||"Errore nella risposta AI.";
}

// ── FILL BLANKS ───────────────────────────────────────────────
function FillTab({T,C,addXP}){
  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState(null);
  const [done,setDone]=useState(false);
  const [score,setScore]=useState(0);
  const q=FILL_BLANKS[idx];
  const answer=(opt)=>{
    if(sel)return;setSel(opt);
    if(opt===q.a){setScore(s=>s+1);addXP(8,"Completamento corretto!","esercizi");}
  };
  const next=()=>{
    if(idx+1>=FILL_BLANKS.length)setDone(true);
    else{setIdx(i=>i+1);setSel(null);}
  };
  const restart=()=>{setIdx(0);setSel(null);setDone(false);setScore(0);};
  if(done)return(
    <div style={{textAlign:"center",padding:"40px 20px",animation:"fadeUp .4s ease"}}>
      <div style={{fontSize:52,marginBottom:12}}>{score>=8?"🏆":score>=6?"🎉":"💪"}</div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:52,fontWeight:600,color:T.gold}}>{score}/{FILL_BLANKS.length}</div>
      <div style={{color:T.gray,fontSize:13,margin:"8px 0 24px"}}>{score>=8?"Eccellente!":score>=6?"Molto bene!":"Continua a esercitarti!"}</div>
      <button onClick={restart} style={C.btn("teal")}>Ricomincia</button>
    </div>
  );
  return(
    <div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:24,fontWeight:600,marginBottom:4}}>Esercizi di <span style={{color:T.teal}}>Completamento</span></div>
      <div style={{color:T.gray,fontSize:11,marginBottom:16}}>Scegli la parola giusta per completare la frase</div>
      <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:20}}>
        <div style={{flex:1,height:4,background:T.border,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${(idx/FILL_BLANKS.length)*100}%`,background:`linear-gradient(90deg,${T.teal},${T.gold})`,borderRadius:2,transition:"width .5s"}}/></div>
        <div style={{fontSize:10,color:T.gray}}>{idx} / {FILL_BLANKS.length}</div>
      </div>
      <div style={{...C.card,textAlign:"center",padding:24,animation:"fadeUp .3s ease"}}>
        <div style={{display:"inline-block",padding:"3px 11px",borderRadius:50,background:T.goldDim,border:`1px solid ${T.gold}44`,color:T.gold,fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>💡 {q.h}</div>
        <div style={{fontFamily:"'Crimson Pro',serif",fontSize:18,fontWeight:600,lineHeight:1.6,marginBottom:20,color:T.white}}>
          {q.s.replace("_____",sel||"______")}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          {q.o.map(opt=>{
            const isC=opt===q.a,isS=opt===sel;
            let bg=T.card,border=T.border,color=T.white;
            if(sel){if(isC){bg=`${T.teal}22`;border=T.teal;color=T.teal;}else if(isS){bg=`${T.red}22`;border=T.red;color=T.red;}}
            return<button key={opt} onClick={()=>answer(opt)} disabled={!!sel} style={{padding:"12px 9px",borderRadius:10,border:`1.5px solid ${border}`,background:bg,color,fontFamily:"inherit",fontSize:12,cursor:sel?"default":"pointer",transition:"all .2s",fontWeight:500}}>{opt}</button>;
          })}
        </div>
        {sel&&<div style={{padding:"9px 13px",borderRadius:9,background:sel===q.a?`${T.teal}18`:`${T.red}18`,color:sel===q.a?T.teal:T.red,fontSize:12,marginBottom:12,animation:"fadeUp .2s ease"}}>{sel===q.a?"✅ Corretto!":` ❌ Giusto: ${q.a}`}</div>}
        {sel&&<button onClick={next} style={C.btn("teal")}>{idx+1>=FILL_BLANKS.length?"Risultati →":"Prossima →"}</button>}
      </div>
    </div>
  );
}

// ── SPEAKING ──────────────────────────────────────────────────
function SpeakingTab({T,C,addXP}){
  const [fbs,setFbs]=useState({});
  const [loading,setLoading]=useState({});
  const getFeedback=async(i,phrase)=>{
    setLoading(l=>({...l,[i]:true}));
    try{
      const text=await callClaude([{role:"user",content:`Spiega come pronunciare correttamente questa frase fiamminga per un italiano: "${phrase}". Concentrati sui suoni difficili. Max 3 righe concise e pratiche.`}]);

// ── AI TUTOR ──────────────────────────────────────────────────
const QUICK_Q=["Come si dice 'febbre'?","Come funziona de/het?","Pronuncia della G fiamminga","Frase per fare un prelievo","Come salutare un paziente anziano","Verbo 'essere' coniugato"];
function AITab({T,C,addXP}){
  const [msgs,setMsgs]=useState([{role:"assistant",text:"Ciao! Sono il tuo tutor di fiammingo sanitario 🏥 Chiédimi regole grammaticali, pronuncia, significato di parole, o esercitati con me in una conversazione!"}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [roleplay,setRoleplay]=useState(false);
  const msgsRef=useRef(null);
  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[msgs]);
  const send=async(text)=>{
    const msg=text||input.trim();
    if(!msg||loading)return;
    setInput("");
    setMsgs(m=>[...m,{role:"user",text:msg}]);
    setLoading(true);
    try{
      const history=msgs.filter(m=>m.text!=="...").map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}));
      history.push({role:"user",content:msg});
      const system=roleplay
        ?"Sei un paziente fiammingo anziano in ospedale. Parla SOLO in fiammingo (semplice). Dopo ogni risposta, dai un breve feedback in italiano all'infermiere su cosa ha detto bene o può migliorare."
        :"Sei un tutor esperto di fiammingo sanitario per operatori italiani che lavorano in Belgio. Rispondi in italiano con esempi in fiammingo. Sii conciso, pratico e incoraggiante. Usa emoji dove utile.";
      const reply=await callClaude(history.slice(-12),system,600);
      setMsgs(m=>[...m,{role:"assistant",text:reply}]);addXP(1);
    }catch{setMsgs(m=>[...m,{role:"assistant",text:"⚠️ Connessione AI non disponibile. Riprova tra poco."}]);}
    setLoading(false);
  };
  return(
    <div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:24,fontWeight:600,marginBottom:4}}>AI <span style={{color:T.teal}}>Tutor</span></div>
      <div style={{color:T.gray,fontSize:11,marginBottom:12}}>Chiedimi qualsiasi cosa sul fiammingo sanitario</div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <button onClick={()=>{setRoleplay(false);setMsgs([{role:"assistant",text:"Modalità tutor attiva! Chiédimi qualsiasi cosa 📚"}]);}} style={C.pill(!roleplay)}>📚 Tutor</button>
        <button onClick={()=>{setRoleplay(true);setMsgs([{role:"assistant",text:"Goedemorgen! Ik ben uw patient. (Modalità conversazione: rispondimi come infermiere!)"}]);}} style={C.pill(roleplay)}>🗣️ Conversazione</button>
      </div>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:6,marginBottom:10}}>
        {QUICK_Q.map(q=><button key={q} onClick={()=>send(q)} style={{padding:"5px 11px",borderRadius:50,border:`1px solid ${T.teal}44`,background:T.tealDim,color:T.teal,fontSize:10,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",fontWeight:600}}>{q}</button>)}
      </div>
      <div ref={msgsRef} style={{minHeight:200,maxHeight:320,overflowY:"auto",padding:12,background:T.bg2,border:`1px solid ${T.border}`,borderRadius:"14px 14px 0 0",display:"flex",flexDirection:"column",gap:10}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",flexDirection:m.role==="user"?"row-reverse":"row"}}>
            <div style={{width:24,height:24,borderRadius:7,background:m.role==="assistant"?`linear-gradient(135deg,${T.teal2},${T.teal})`:"linear-gradient(135deg,#5b4fcf,#8b7fef)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0}}>{m.role==="assistant"?"🤖":"👤"}</div>
            <div style={{maxWidth:"82%",padding:"9px 12px",borderRadius:10,fontSize:12,lineHeight:1.6,background:m.role==="assistant"?T.tealDim:"rgba(91,79,207,.2)",border:`1px solid ${m.role==="assistant"?T.teal+"33":"rgba(91,79,207,.3)"}`,color:T.white,whiteSpace:"pre-wrap"}}>{m.text}</div>
          </div>
        ))}
        {loading&&<div style={{display:"flex",gap:8}}><div style={{width:24,height:24,borderRadius:7,background:`linear-gradient(135deg,${T.teal2},${T.teal})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>🤖</div><div style={{padding:"9px 12px",borderRadius:10,fontSize:12,background:T.tealDim,border:`1px solid ${T.teal}33`,color:T.gray,animation:"pulse 1s infinite"}}>...</div></div>}
      </div>
      <div style={{display:"flex",border:`1px solid ${T.border}`,borderTop:"none",borderRadius:"0 0 14px 14px",overflow:"hidden"}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder={roleplay?"Rispondimi come infermiere...":"Scrivi la tua domanda..."} style={{flex:1,background:T.bg3,border:"none",padding:"11px 13px",color:T.white,fontFamily:"inherit",fontSize:12,outline:"none"}}/>
        <button onClick={()=>send()} disabled={loading||!input.trim()} style={{padding:"11px 16px",background:T.teal,border:"none",color:T.bg,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",opacity:loading||!input.trim()?.5:1}}>Invia</button>
      </div>
    </div>
  );
}

// ── FLASHCARD ─────────────────────────────────────────────────
function FlashTab({T,C,st,addXP,updSt}){
  const [deck,setDeck]=useState("all");
  const [queue,setQueue]=useState([]);
  const [idx,setIdx]=useState(0);
  const [flipped,setFlipped]=useState(false);
  useEffect(()=>{
    const pool=deck==="all"?VOCAB:VOCAB.filter(v=>v.cat===deck);
    const nl=pool.filter(v=>!st.learned.includes(v.nl)).sort(()=>Math.random()-.5);
    const lrn=pool.filter(v=>st.learned.includes(v.nl)).sort(()=>Math.random()-.5);
    setQueue([...nl,...lrn]);setIdx(0);setFlipped(false);
  },[deck]);
  const cur=queue[idx%(queue.length||1)];
  const rate=(r)=>{
    if(!cur)return;
    if(r==="easy"){if(!st.learned.includes(cur.nl))updSt({learned:[...st.learned,cur.nl]});addXP(3,"Facile!",cur.cat);}
    else if(r==="good")addXP(1,"",cur.cat);
    if(r==="again"){const nq=[...queue];const rem=nq.splice(idx%nq.length,1)[0];nq.push(rem);setQueue(nq);setFlipped(false);}
    else{setIdx(i=>i+1);setFlipped(false);}
  };
  const learned=st.learned.length;const total=queue.length;
  return(
    <div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:24,fontWeight:600,marginBottom:4}}>Flash<span style={{color:T.teal}}>card</span></div>
      <div style={{color:T.gray,fontSize:11,marginBottom:14}}>Tocca la card per girarla, poi valuta</div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {[["Da fare",Math.max(0,total-learned)],["Imparate",learned],["Totale",total]].map(([l,n])=>(
          <div key={l} style={{flex:1,...C.card,textAlign:"center",padding:"11px"}}>
            <div style={{fontFamily:"'Crimson Pro',serif",fontSize:22,fontWeight:600,color:T.gold}}>{n}</div>
            <div style={{fontSize:9,color:T.gray,marginTop:1}}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:16}}>
        {["all","corpo","sintomi","cura","geriatria","farmaci"].map(d=>(
          <button key={d} onClick={()=>setDeck(d)} style={{padding:"5px 12px",borderRadius:50,border:`1px solid ${deck===d?T.teal:T.border}`,background:deck===d?T.teal:"transparent",color:deck===d?T.bg:T.gray,fontSize:10,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",fontWeight:700}}>{d==="all"?"Tutto":d}</button>
        ))}
      </div>
      {cur&&<>
        <div style={{perspective:1200,cursor:"pointer",marginBottom:8}} onClick={()=>setFlipped(f=>!f)}>
          <div className={`fc-inner${flipped?" flipped":""}`}>
            <div className="fc-face" style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"24px 20px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}>
              <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:1.5,color:T.gray,marginBottom:8}}>Fiammingo</div>
              <div style={{fontFamily:"'Crimson Pro',serif",fontSize:26,fontWeight:600,marginBottom:5}}>{cur.nl}</div>
              <div style={{fontSize:11,color:T.gray,fontStyle:"italic",marginBottom:8}}>📢 /{cur.ph}/</div>
              <button onClick={e=>{e.stopPropagation();speak(cur.nl);}} style={{width:32,height:32,borderRadius:9,border:`1px solid ${T.border}`,background:"transparent",color:T.gray,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>🔊</button>
            </div>
            <div className="fc-face fc-back" style={{background:`rgba(0,40,30,.6)`,border:`1px solid ${T.teal}33`,borderRadius:16,padding:"24px 20px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}>
              <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:1.5,color:T.gray,marginBottom:8}}>Italiano</div>
              <div style={{fontSize:20,color:T.gold,marginBottom:7}}>{cur.it}</div>
              <div style={{fontSize:11,color:`${T.white}55`,lineHeight:1.6}}>{cur.ex}</div>
            </div>
          </div>
        </div>

            <button key={r} onClick={()=>rate(r)} style={{flex:1,maxWidth:130,padding:10,borderRadius:10,border:`1px solid ${c}55`,background:`${c}22`,color:c,fontFamily:"inherit",fontSize:11,fontWeight:700,cursor:"pointer"}}>{l}</button>

// ── QUIZ ──────────────────────────────────────────────────────
function QuizTab({T,C,st,addXP,updSt}){
  const [qType,setQType]=useState("nl2it");
  const [questions,setQuestions]=useState([]);
  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState(null);
  const [score,setScore]=useState(0);
  const [done,setDone]=useState(false);
  const build=(type)=>{
    const qs=[...VOCAB].sort(()=>Math.random()-.5).slice(0,10).map(item=>{
      const isNL=type==="nl2it"||(type==="mixed"&&Math.random()>.5);
      const q=isNL?item.nl:item.it,c=isNL?item.it:item.nl;
      const w=VOCAB.filter(v=>v.nl!==item.nl).sort(()=>Math.random()-.5).slice(0,3).map(v=>isNL?v.it:v.nl);
      return{q,c,opts:[...w,c].sort(()=>Math.random()-.5),hint:"Categoria: "+item.cat,dir:isNL?"NL → IT":"IT → NL",cat:item.cat};
    });
    setQuestions(qs);setIdx(0);setSel(null);setScore(0);setDone(false);
  };
  useEffect(()=>{build(qType);},[]);
  const answer=(opt)=>{
    if(sel)return;setSel(opt);
    if(opt===questions[idx].c){setScore(s=>s+1);addXP(10,"Risposta corretta!",questions[idx].cat);}
  };
  const next=()=>{
    if(idx+1>=questions.length){updSt({quizDone:st.quizDone+1,correct:st.correct+score,answered:st.answered+questions.length});setDone(true);}
    else{setIdx(i=>i+1);setSel(null);}
  };
  if(!questions.length)return null;
  const q=questions[idx];
  if(done)return(
    <div style={{textAlign:"center",padding:"40px 20px",animation:"fadeUp .4s ease"}}>
      <div style={{fontSize:48,marginBottom:12}}>{score>=9?"🏆":score>=7?"🎉":score>=5?"💪":"📚"}</div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:52,fontWeight:600,color:T.gold,lineHeight:1}}>{score}/10</div>
      <div style={{color:T.gray,fontSize:13,margin:"8px 0 6px"}}>{score>=9?"Eccellente!":score>=7?"Molto bene!":score>=5?"Buono, continua!":"Ripassia ancora!"}</div>
      <div style={{fontSize:12,color:T.teal,marginBottom:24}}>+{score*10} XP guadagnati!</div>
      <button onClick={()=>build(qType)} style={C.btn("teal")}>Ricomincia</button>
    </div>
  );
  return(
    <div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:24,fontWeight:600,marginBottom:4}}>Quiz <span style={{color:T.teal}}>Interattivo</span></div>
      <div style={{color:T.gray,fontSize:11,marginBottom:14}}>10 domande casuali — 10 XP per risposta corretta</div>
      <div style={{display:"flex",gap:7,marginBottom:14,justifyContent:"center"}}>
        {[["nl2it","NL → IT"],["it2nl","IT → NL"],["mixed","Misto"]].map(([t,l])=>(
          <button key={t} onClick={()=>{setQType(t);build(t);}} style={C.pill(qType===t)}>{l}</button>
        ))}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:18}}>
        <div style={{flex:1,height:4,background:T.border,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${(idx/questions.length)*100}%`,background:`linear-gradient(90deg,${T.teal},${T.gold})`,borderRadius:2,transition:"width .5s"}}/></div>
        <div style={{fontSize:10,color:T.gray}}>{idx} / {questions.length}</div>
      </div>
      <div style={{...C.card,textAlign:"center",padding:"22px 16px",animation:"fadeUp .3s ease"}}>
        <div style={{display:"inline-block",padding:"3px 11px",borderRadius:50,background:T.goldDim,border:`1px solid ${T.gold}44`,color:T.gold,fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>{q.dir}</div>
        <div style={{fontFamily:"'Crimson Pro',serif",fontSize:22,fontWeight:600,marginBottom:5,lineHeight:1.3}}>{q.q}</div>
        <div style={{color:T.gray,fontSize:11,marginBottom:18}}>{q.hint}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:13}}>
          {q.opts.map(opt=>{
            const isC=opt===q.c,isS=opt===sel;
            let bg=T.card,border=T.border,color=T.white;
            if(sel){if(isC){bg=`${T.teal}22`;border=T.teal;color=T.teal;}else if(isS){bg=`${T.red}22`;border=T.red;color=T.red;}}
            return<button key={opt} onClick={()=>answer(opt)} disabled={!!sel} style={{padding:"12px 9px",borderRadius:10,border:`1.5px solid ${border}`,background:bg,color,fontFamily:"inherit",fontSize:12,cursor:sel?"default":"pointer",transition:"all .2s",fontWeight:500}}>{opt}</button>;
          })}
        </div>
        {sel&&<div style={{padding:"9px 13px",borderRadius:9,background:sel===q.c?`${T.teal}18`:`${T.red}18`,color:sel===q.c?T.teal:T.red,fontSize:12,marginBottom:12,animation:"fadeUp .2s ease"}}>{sel===q.c?"✅ Corretto!":` ❌ Giusto: ${q.c}`}</div>}
        {sel&&<button onClick={next} style={C.btn("teal")}>{idx+1>=questions.length?"Risultati →":"Prossima →"}</button>}
      </div>
    </div>
  );
}

// ── PLAN ──────────────────────────────────────────────────────
function PlanTab({T,C,st,updSt}){
  const [departure,setDeparture]=useState(st.departureDate||"");
  const [level,setLevel]=useState(st.studyLevel||"beginner");
  const [plan,setPlan]=useState(null);
  const [loading,setLoading]=useState(false);
  const generate=async()=>{
    setLoading(true);
    const daysLeft=departure?Math.max(0,Math.round((new Date(departure)-new Date())/86400000)):null;
    try{
      const text=await callClaude([{role:"user",content:`Crea un piano di studio settimanale per imparare il fiammingo sanitario. Livello: ${level==="beginner"?"principiante":level==="intermediate"?"intermedio":"avanzato"}. ${daysLeft!==null?`Giorni disponibili: ${daysLeft}.`:""}Parole già imparate: ${st.learned.length} su 90. Quiz completati: ${st.quizDone}. Crea un piano pratico con attività quotidiane specifiche. Max 7 giorni. Sii concreto e motivante.`}],"",800);
      setPlan(text);updSt({departureDate:departure,studyLevel:level});

  return(
    <div>

          <input type="date" value={departure} onChange={e=>setDeparture(e.target.value)} style={{width:"100%",background:T.bg3,border:`1px solid ${T.border}`,borderRadius:9,padding:"9px 12px",color:T.white,fontFamily:"inherit",fontSize:12,outline:"none"}}/>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:6,color:T.teal}}>📊 Livello attuale</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {[["beginner","🌱 Principiante"],["intermediate","📈 Intermedio"],["advanced","🚀 Avanzato"]].map(([v,l])=>(
              <button key={v} onClick={()=>setLevel(v)} style={C.pill(level===v)}>{l}</button>
            ))}
          </div>
        </div>
        <button onClick={generate} disabled={loading} style={{...C.btn("teal"),width:"100%",padding:12,opacity:loading?.6:1}}>

        </button>
      </div>
      {plan&&<div style={{...C.card,animation:"fadeUp .4s ease",marginTop:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,color:T.teal}}>📋 Il tuo piano personalizzato</div>
          <button onClick={exportData} style={{padding:"5px 12px",borderRadius:50,border:`1px solid ${T.gold}55`,background:T.goldDim,color:T.gold,fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>📤 Esporta</button>
        </div>
        <div style={{fontSize:12,lineHeight:1.8,color:`${T.white}cc`,whiteSpace:"pre-wrap"}}>{plan}</div>
      </div>}
    </div>
  );
}

// ── VERBS TAB ─────────────────────────────────────────────────
function VerbsTab({T,C,addXP}){
  const [open,setOpen]=useState(null);
  const [mode,setMode]=useState("table"); // table | quiz
  const [qIdx,setQIdx]=useState(0);
  const [qAns,setQAns]=useState(null);
  const [qScore,setQScore]=useState(0);
  const [qDone,setQDone]=useState(false);

  // Build verb quiz questions
  const buildVQ=()=>{
    const qs=[];
    IRREGULAR_VERBS.forEach(v=>{
      v.present.forEach(([person,form])=>{
        const wrong=IRREGULAR_VERBS.filter(w=>w.inf!==v.inf).map(w=>w.present.find(p=>p[0]===person)?.[1]).filter(Boolean).sort(()=>Math.random()-.5).slice(0,3);
        if(wrong.length===3) qs.push({q:`"${v.inf}" (${v.it}) — ${person} →`,correct:form,opts:[...wrong,form].sort(()=>Math.random()-.5),verb:v.inf});
      });
    });
    return qs.sort(()=>Math.random()-.5).slice(0,12);
  };
  const [vQuiz]=useState(()=>buildVQ());

  if(mode==="quiz"){
    if(qDone) return(
      <div style={{textAlign:"center",padding:"40px 20px",animation:"fadeUp .4s ease"}}>
        <div style={{fontSize:52,marginBottom:12}}>{qScore>=10?"🏆":qScore>=7?"🎉":"💪"}</div>
        <div style={{fontFamily:"'Crimson Pro',serif",fontSize:52,fontWeight:600,color:T.gold}}>{qScore}/12</div>
        <div style={{color:T.gray,fontSize:13,margin:"8px 0 24px"}}>{qScore>=10?"Ottimo con i verbi!":qScore>=7?"Bene, continua!":"Ripassia le coniugazioni!"}</div>
        <button onClick={()=>{setMode("table");setQIdx(0);setQAns(null);setQScore(0);setQDone(false);}} style={C.btn("teal")}>Torna alle tabelle</button>
      </div>
    );
    const q=vQuiz[qIdx];
    return(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontFamily:"'Crimson Pro',serif",fontSize:22,fontWeight:600}}>Quiz <span style={{color:T.teal}}>Verbi</span></div>
          <button onClick={()=>setMode("table")} style={{padding:"5px 12px",borderRadius:50,border:`1px solid ${T.border}`,background:"transparent",color:T.gray,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>← Tabelle</button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:18}}>
          <div style={{flex:1,height:4,background:T.border,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${(qIdx/vQuiz.length)*100}%`,background:`linear-gradient(90deg,${T.teal},${T.gold})`,borderRadius:2,transition:"width .5s"}}/></div>

        <div style={{...C.card,textAlign:"center",padding:"24px 16px",animation:"fadeUp .3s ease"}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
            {q.opts.map(opt=>{

        </div>
      </div>
    );
  }

// ── CONVERSATION SIMULATOR TAB ────────────────────────────────
function ConvoTab({T,C,addXP}){
  const [scenario,setScenario]=useState(null);
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const msgsRef=useRef(null);
  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[msgs]);

  const startScenario=(sc)=>{
    setScenario(sc);
    setMsgs([{role:"assistant",text:`Scenario: **${sc.title}**\n\n${sc.desc}\n\nSono pronto. Inizia la conversazione in fiammingo! 🇧🇪`}]);
    setInput("");
  };

  const send=async()=>{
    const msg=input.trim();
    if(!msg||loading)return;
    setInput("");
    setMsgs(m=>[...m,{role:"user",text:msg}]);
    setLoading(true);
    try{
      const history=msgs.map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}));
      history.push({role:"user",content:msg});
      const reply=await callClaude(history.slice(-16),scenario.role,700);
      setMsgs(m=>[...m,{role:"assistant",text:reply}]);
      addXP(3,"Conversazione!");
    }catch{setMsgs(m=>[...m,{role:"assistant",text:"⚠️ Connessione AI non disponibile."}]);}
    setLoading(false);
  };

  if(!scenario) return(
    <div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:24,fontWeight:600,marginBottom:4}}>Simulatore di <span style={{color:T.teal}}>Conversazione</span></div>
      <div style={{color:T.gray,fontSize:11,marginBottom:16}}>L'AI simula pazienti, colleghi e familiari. Tu parli in fiammingo — l'AI corregge i tuoi errori!</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {CONV_SCENARIOS.map(sc=>(
          <div key={sc.id} onClick={()=>startScenario(sc)} style={{...C.card,display:"flex",alignItems:"center",gap:12,cursor:"pointer",transition:"all .2s"}}>

              <div style={{fontWeight:700,fontSize:14,marginBottom:2}}>{sc.title}</div>
              <div style={{fontSize:11,color:T.gray}}>{sc.desc}</div>
            </div>
            <div style={{color:T.teal,fontSize:18}}>→</div>
          </div>
        ))}
      </div>
    </div>
  );

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <button onClick={()=>setScenario(null)} style={{padding:"6px 13px",borderRadius:50,border:`1px solid ${T.border}`,background:"transparent",color:T.gray,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>← Scenari</button>
        <div style={{flex:1,fontFamily:"'Crimson Pro',serif",fontSize:18,fontWeight:600}}>{scenario.icon} {scenario.title}</div>
      </div>
      <div ref={msgsRef} style={{minHeight:250,maxHeight:380,overflowY:"auto",padding:12,background:T.bg2,border:`1px solid ${T.border}`,borderRadius:"14px 14px 0 0",display:"flex",flexDirection:"column",gap:10}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",flexDirection:m.role==="user"?"row-reverse":"row"}}>
            <div style={{width:24,height:24,borderRadius:7,background:m.role==="assistant"?`linear-gradient(135deg,${T.teal2},${T.teal})`:"linear-gradient(135deg,#5b4fcf,#8b7fef)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0}}>
              {m.role==="assistant"?scenario.icon:"👤"}
            </div>
            <div style={{maxWidth:"84%",padding:"9px 12px",borderRadius:10,fontSize:12,lineHeight:1.7,background:m.role==="assistant"?T.tealDim:"rgba(91,79,207,.2)",border:`1px solid ${m.role==="assistant"?T.teal+"33":"rgba(91,79,207,.3)"}`,color:T.white,whiteSpace:"pre-wrap"}}>{m.text}</div>
          </div>
        ))}
        {loading&&<div style={{display:"flex",gap:8}}><div style={{width:24,height:24,borderRadius:7,background:`linear-gradient(135deg,${T.teal2},${T.teal})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>{scenario.icon}</div><div style={{padding:"9px 12px",borderRadius:10,fontSize:12,background:T.tealDim,color:T.gray,animation:"pulse 1s infinite"}}>...</div></div>}

// ── DAILY CHALLENGE TAB ───────────────────────────────────────
function DailyTab({T,C,st,addXP,updSt}){
  const today=new Date().toDateString();
  const alreadyDone=st.dailyDate===today&&st.dailyScore!==undefined;
  const [phase,setPhase]=useState(alreadyDone?"done":"intro");
  const [challenges]=useState(()=>{
    // Pick 5 random vocab + 2 phrases for today
    const vq=[...VOCAB].sort(()=>Math.random()-.5).slice(0,5).map(v=>({type:"vocab",q:v.nl,a:v.it,opts:[v.it,...VOCAB.filter(x=>x.nl!==v.nl).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.it)].sort(()=>Math.random()-.5)}));
    const pq=[...PHRASES].sort(()=>Math.random()-.5).slice(0,2).map(p=>({type:"phrase",q:p.nl,a:p.it,opts:[p.it,...PHRASES.filter(x=>x.nl!==p.nl).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.it)].sort(()=>Math.random()-.5)}));
    return [...vq,...pq].sort(()=>Math.random()-.5);
  });
  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState(null);
  const [score,setScore]=useState(0);

  const answer=(opt)=>{
    if(sel)return;setSel(opt);
    if(opt===challenges[idx].a)setScore(s=>s+1);
  };
  const next=()=>{
    if(idx+1>=challenges.length){
      const xpEarned=(score+1)*15;
      addXP(xpEarned,"Sfida giornaliera!");
      updSt({dailyDate:today,dailyScore:score+1,streak:(st.streak||0)+1});
      setPhase("done");
    } else {setIdx(i=>i+1);setSel(null);}
  };

  if(phase==="done"||alreadyDone) return(
    <div style={{textAlign:"center",padding:"32px 20px",animation:"fadeUp .4s ease"}}>
      <div style={{fontSize:56,marginBottom:12}}>⚡</div>

      <div style={{...C.card,display:"inline-block",padding:"16px 28px",textAlign:"center"}}>
        <div style={{fontFamily:"'Crimson Pro',serif",fontSize:40,fontWeight:700,color:T.teal}}>{st.dailyScore||score}/{challenges.length}</div>
        <div style={{fontSize:12,color:T.gray,marginTop:4}}>risposte corrette oggi</div>
      </div>
      <div style={{marginTop:20,fontSize:13,color:T.teal}}>🔥 Streak: {st.streak||1} {(st.streak||1)===1?"giorno":"giorni"} consecutivi</div>
    </div>
  );

  if(phase==="intro") return(
    <div style={{textAlign:"center",padding:"32px 20px"}}>
      <div style={{fontSize:56,marginBottom:16}}>⚡</div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:26,fontWeight:700,marginBottom:8}}>Sfida del Giorno</div>
      <div style={{color:T.gray,fontSize:13,marginBottom:24,lineHeight:1.7}}>Ogni giorno 7 domande nuove.<br/>Completale tutte per guadagnare XP bonus e mantenere la streak! 🔥</div>
      <div style={{...C.card,padding:"16px",marginBottom:24,textAlign:"left"}}>
        <div style={{fontWeight:700,marginBottom:8,color:T.teal}}>La sfida di oggi include:</div>
        <div style={{fontSize:12,color:T.gray,lineHeight:1.8}}>• 5 parole di vocabolario casuali<br/>• 2 frasi essenziali<br/>• Tempo: illimitato<br/>• Bonus XP: {challenges.length * 15} XP se fai tutto</div>
      </div>
      <button onClick={()=>setPhase("quiz")} style={{...C.btn("teal"),padding:"14px 40px",fontSize:15}}>Inizia la sfida! ⚡</button>
    </div>
  );

  const q=challenges[idx];
  return(
    <div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:22,fontWeight:600,marginBottom:4}}>Sfida <span style={{color:T.gold}}>del Giorno</span></div>
      <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:20}}>
        <div style={{flex:1,height:5,background:T.border,borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${(idx/challenges.length)*100}%`,background:`linear-gradient(90deg,${T.gold},${T.teal})`,borderRadius:3,transition:"width .5s"}}/></div>
        <div style={{fontSize:10,color:T.gray}}>{idx}/{challenges.length}</div>
      </div>
      <div style={{...C.card,textAlign:"center",padding:"24px 16px",animation:"fadeUp .3s ease"}}>
        <div style={{display:"inline-block",padding:"3px 11px",borderRadius:50,background:T.goldDim,border:`1px solid ${T.gold}44`,color:T.gold,fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>⚡ Sfida #{idx+1}</div>

        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14,textAlign:"left"}}>
          {q.opts.map(opt=>{
            const isC=opt===q.a,isS=opt===sel;
            let bg=T.card,bord=T.border,col=T.white;
            if(sel){if(isC){bg=`${T.teal}22`;bord=T.teal;col=T.teal;}else if(isS){bg=`${T.red}22`;bord=T.red;col=T.red;}}
            return<button key={opt} onClick={()=>answer(opt)} disabled={!!sel} style={{padding:"12px 14px",borderRadius:10,border:`1.5px solid ${bord}`,background:bg,color:col,fontFamily:"inherit",fontSize:12,cursor:sel?"default":"pointer",transition:"all .2s",textAlign:"left",fontWeight:500}}>{opt}</button>;

  );

function AnkiTab({T,C,st,addXP,updSt}){

    }).sort((a,b)=>{
      const da=st.ankiCards?.[a.nl]?.due||0;
      const db=st.ankiCards?.[b.nl]?.due||0;
      return da-db;
    });

  },[deck,st.ankiCards]);

  };

          <div key={l} style={{flex:1,...C.card,textAlign:"center",padding:"11px"}}>
            <div style={{fontFamily:"'Crimson Pro',serif",fontSize:22,fontWeight:600,color:T[c]}}>{n}</div>
            <div style={{fontSize:9,color:T.gray,marginTop:1}}>{l}</div>
          </div>
        ))}
      </div>

      {nextIn&&allDue===0&&<div style={{...C.card,textAlign:"center",padding:20,background:`${T.tealDim}`,border:`1px solid ${T.teal}33`}}>
        <div style={{fontSize:32,marginBottom:8}}>✅</div>
        <div style={{fontWeight:700,marginBottom:4}}>Tutte le card ripassate!</div>
        <div style={{fontSize:11,color:T.gray}}>Prossima revisione tra {nextIn<24?`${nextIn}h`:`${Math.ceil(nextIn/24)} giorni`}</div>
      </div>}

      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:16}}>
        {["all","corpo","sintomi","cura","geriatria","farmaci","professioni"].map(d=>(
          <button key={d} onClick={()=>setDeck(d)} style={{padding:"5px 12px",borderRadius:50,border:`1px solid ${deck===d?T.teal:T.border}`,background:deck===d?T.teal:"transparent",color:deck===d?T.bg:T.gray,fontSize:10,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",fontWeight:700}}>{d==="all"?"Tutte":d}</button>
        ))}
      </div>

      {cur&&<>
        <div style={{marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:10,color:T.gray}}>Card {idx+1} di {dueCount}</div>
          <div style={{fontSize:10,color:T.gray}}>
            {st.ankiCards?.[cur.nl]?.reps>0?`Ripetizione #${st.ankiCards[cur.nl].reps+1}`:"Prima volta 🆕"}
          </div>
        </div>
        <div style={{perspective:1200,cursor:"pointer",marginBottom:8}} onClick={()=>setFlipped(f=>!f)}>
          <div className={`fc-inner${flipped?" flipped":""}`}>
            <div className="fc-face" style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"28px 20px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}>
              <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:1.5,color:T.gray,marginBottom:8}}>Fiammingo → Italiano</div>
              <div style={{fontFamily:"'Crimson Pro',serif",fontSize:28,fontWeight:600,marginBottom:6}}>{cur.nl}</div>
              <div style={{fontSize:11,color:T.gray,fontStyle:"italic",marginBottom:10}}>📢 /{cur.ph}/</div>
              <div style={{fontSize:10,color:T.teal,marginBottom:10}}>{cur.cat}</div>
              <button onClick={e=>{e.stopPropagation();speak(cur.nl);}} style={{width:34,height:34,borderRadius:9,border:`1px solid ${T.border}`,background:"transparent",color:T.gray,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>🔊</button>
              <div style={{fontSize:10,color:T.gray,marginTop:10}}>👆 Tocca per vedere la risposta</div>
            </div>
            <div className="fc-face fc-back" style={{background:`rgba(0,40,30,.7)`,border:`1px solid ${T.teal}44`,borderRadius:16,padding:"24px 20px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}>
              <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:1.5,color:T.gray,marginBottom:8}}>Risposta</div>
              <div style={{fontSize:22,color:T.gold,marginBottom:8,fontWeight:600}}>{cur.it}</div>
              <div style={{fontSize:11,color:`${T.white}66`,lineHeight:1.6,marginBottom:8}}>{cur.ex}</div>
              <div style={{fontSize:10,color:T.gray}}>Quanto la ricordavi?</div>
            </div>
          </div>
        </div>

        {flipped&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,animation:"fadeUp .2s ease"}}>
          {[
            [0,"😓 Non ricordo",T.red,"Rivedere tra 1 giorno"],
            [3,"👍 Ricordo",T.teal,"Intervallo aumenta"],
            [5,"⭐ Perfetto!",T.gold,"Intervallo lungo"],
          ].map(([g,l,c,sub])=>(
            <button key={g} onClick={()=>rate(g)} style={{padding:"10px 6px",borderRadius:12,border:`1px solid ${c}55`,background:`${c}18`,color:c,fontFamily:"inherit",fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"center"}}>
              {l}<div style={{fontSize:9,opacity:.7,marginTop:3,fontWeight:400}}>{sub}</div>
            </button>
          ))}
        </div>}
        {!flipped&&cur&&<div style={{height:80}}/>}
      </>}
      {!cur&&dueCount===0&&allDue===0&&<div style={{...C.card,textAlign:"center",padding:20}}>
        <div style={{fontSize:32,marginBottom:8}}>🎉</div>
        <div style={{fontWeight:700}}>Nessuna card da ripassare ora!</div>
        <div style={{fontSize:11,color:T.gray,marginTop:4}}>Torna più tardi o cambia il deck.</div>
      </div>}
    </div>
  );
}

// ── LISTEN TAB ────────────────────────────────────────────────
function ListenTab({T,C,st,addXP,updSt}){
  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState(null);
  const [played,setPlayed]=useState(false);
  const [done,setDone]=useState(false);
  const [score,setScore]=useState(0);
  const [questions]=useState(()=>[...LISTEN_EX].sort(()=>Math.random()-.5));

  const q=questions[idx];
  const playAudio=()=>{speak(q.nl);setPlayed(true);};
  const answer=(opt)=>{
    if(sel)return;setSel(opt);
    if(opt===q.it){setScore(s=>s+1);addXP(12,"Ascolto corretto!");};
  };
  const next=()=>{
    if(idx+1>=questions.length){
      updSt({listenDone:(st.listenDone||0)+questions.length});
      setDone(true);
    } else {setIdx(i=>i+1);setSel(null);setPlayed(false);}
  };

  if(done)return(
    <div style={{textAlign:"center",padding:"40px 20px",animation:"fadeUp .4s ease"}}>
      <div style={{fontSize:52,marginBottom:12}}>{score>=10?"🏆":score>=7?"🎉":"💪"}</div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:52,fontWeight:600,color:T.gold}}>{score}/{questions.length}</div>
      <div style={{color:T.gray,fontSize:13,margin:"8px 0 24px"}}>{score>=10?"Orecchio perfetto!":score>=7?"Ottimo ascolto!":"Continua ad allenarti!"}</div>
      <button onClick={()=>{setIdx(0);setSel(null);setPlayed(false);setDone(false);setScore(0);}} style={C.btn("teal")}>Ricomincia</button>
    </div>
  );

  return(
    <div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:24,fontWeight:600,marginBottom:4}}>Esercizi di <span style={{color:T.teal}}>Ascolto</span></div>
      <div style={{color:T.gray,fontSize:11,marginBottom:16}}>Ascolta la frase fiamminga e scegli la traduzione corretta</div>

      <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:20}}>
        <div style={{flex:1,height:4,background:T.border,borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(idx/questions.length)*100}%`,background:`linear-gradient(90deg,${T.teal},${T.gold})`,borderRadius:2,transition:"width .5s"}}/>
        </div>
        <div style={{fontSize:10,color:T.gray}}>{idx} / {questions.length}</div>
      </div>

      <div style={{...C.card,textAlign:"center",padding:"28px 18px",animation:"fadeUp .3s ease"}}>
        <div style={{fontSize:32,marginBottom:16}}>🎧</div>
        <div style={{fontSize:13,color:T.gray,marginBottom:20}}>Premi il pulsante per ascoltare, poi scegli la traduzione</div>

        <button onClick={playAudio} style={{padding:"14px 32px",borderRadius:50,border:`2px solid ${T.teal}`,background:played?T.tealDim:"transparent",color:T.teal,fontFamily:"inherit",fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:24,display:"flex",alignItems:"center",gap:8,margin:"0 auto 24px"}}>
          🔊 {played?"Riascolta":"Ascolta"}
        </button>

        {played&&<>
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14,textAlign:"left"}}>
            {q.opts.map((opt,oi)=>{
              const isC=opt===q.it,isS=opt===sel;
              let bg=T.card,border=T.border,color=T.white;
              if(sel){if(isC){bg=`${T.teal}22`;border=T.teal;color=T.teal;}else if(isS){bg=`${T.red}22`;border=T.red;color=T.red;}}
              return<button key={oi} onClick={()=>answer(opt)} disabled={!!sel} style={{padding:"13px 16px",borderRadius:10,border:`1.5px solid ${border}`,background:bg,color,fontFamily:"inherit",fontSize:13,cursor:sel?"default":"pointer",transition:"all .2s",textAlign:"left",fontWeight:500}}>
                {String.fromCharCode(65+oi)}. {opt}
              </button>;
            })}
          </div>
          {sel&&<div style={{padding:"9px 13px",borderRadius:9,background:sel===q.it?`${T.teal}18`:`${T.red}18`,color:sel===q.it?T.teal:T.red,fontSize:12,marginBottom:12,animation:"fadeUp .2s ease"}}>
            {sel===q.it?"✅ Corretto! "+q.nl:"❌ Giusto: "+q.it}
          </div>}
          {sel&&<button onClick={next} style={C.btn("teal")}>{idx+1>=questions.length?"Risultati →":"Prossima →"}</button>}
        </>}
      </div>
    </div>
  );
}

// ── BADGES TAB ────────────────────────────────────────────────
function BadgesTab({T,C,st}){
  const earned=WEEKLY_GOALS.filter(g=>g.check(st));
  const total=WEEKLY_GOALS.length;
  const pct=Math.round(earned.length/total*100);

  return(
    <div>
      <div style={{fontFamily:"'Crimson Pro',serif",fontSize:24,fontWeight:600,marginBottom:4}}>Badge &amp; <span style={{color:T.gold}}>Obiettivi</span></div>
      <div style={{color:T.gray,fontSize:11,marginBottom:16}}>Sblocca badge completando obiettivi — {earned.length}/{total} ottenuti</div>

      <div style={{...C.card,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:12,fontWeight:700}}>Progresso badge</div>
          <div style={{fontSize:12,color:T.gold,fontWeight:700}}>{pct}%</div>
        </div>
        <div style={{height:8,background:T.border,borderRadius:4,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${T.teal},${T.gold})`,borderRadius:4,transition:"width .8s"}}/>
        </div>
        <div style={{fontSize:10,color:T.gray,marginTop:6}}>{earned.length} su {total} badge sbloccati</div>
      </div>

      {earned.length>0&&<>
        <div style={{fontSize:12,fontWeight:700,color:T.teal,marginBottom:10,textTransform:"uppercase",letterSpacing:".5px"}}>✅ Ottenuti</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:9,marginBottom:20}}>
          {earned.map(g=>(
            <div key={g.id} style={{...C.card,textAlign:"center",padding:"16px 10px",borderColor:`${T.gold}44`,background:`${T.goldDim}`}}>
              <div style={{fontSize:36,marginBottom:6}}>{g.icon}</div>
              <div style={{fontSize:12,fontWeight:700,marginBottom:2}}>{g.label}</div>
              <div style={{fontSize:10,color:T.gray,lineHeight:1.4}}>{g.desc}</div>
              <div style={{fontSize:9,color:T.gold,marginTop:6,fontWeight:700}}>✅ SBLOCCATO</div>
            </div>
          ))}
        </div>
      </>}

      <div style={{fontSize:12,fontWeight:700,color:T.gray,marginBottom:10,textTransform:"uppercase",letterSpacing:".5px"}}>🔒 Da sbloccare</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:9}}>
        {WEEKLY_GOALS.filter(g=>!g.check(st)).map(g=>(
          <div key={g.id} style={{...C.card,textAlign:"center",padding:"16px 10px",opacity:.6}}>
            <div style={{fontSize:36,marginBottom:6,filter:"grayscale(100%)"}}>{g.icon}</div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:2}}>{g.label}</div>
            <div style={{fontSize:10,color:T.gray,lineHeight:1.4}}>{g.desc}</div>
            <div style={{fontSize:9,color:T.gray,marginTop:6}}>🔒 BLOCCATO</div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

let deferredPrompt=null;

  banner.id='installBanner';
  banner.innerHTML='<div style="position:fixed;bottom:80px;left:12px;right:12px;background:linear-gradient(135deg,#0d1c2e,#122338);border:1px solid rgba(0,201,167,.4);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:9998;box-shadow:0 8px 32px rgba(0,0,0,.5)"><span style="font-size:28px">🏥</span><div style="flex:1"><div style="font-weight:700;font-size:13px;color:#eef3ff">Installa Zorg & Taal Pro</div><div style="font-size:11px;color:#6a7d96;margin-top:2px">Funziona anche offline!</div></div><button id="installBtn" style="padding:7px 16px;border-radius:50px;border:none;background:#00c9a7;color:#08131f;font-weight:700;font-size:12px;cursor:pointer">Installa</button><button id="dismissBtn" style="padding:7px 12px;border-radius:50px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#6a7d96;font-size:11px;cursor:pointer">Dopo</button></div>';
  document.body.appendChild(banner);
  document.getElementById('installBtn').onclick=()=>{deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{banner.remove();});};
  document.getElementById('dismissBtn').onclick=()=>banner.remove();
});
const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);

}
